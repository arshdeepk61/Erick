apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-service
  labels:
    app: ecommerce-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-service
  template:
    metadata:
      labels:
        app: ecommerce-service
    spec:
      containers:
      - name: ecommerce-service
        image: ecommerce-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "dev"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-service
spec:
  selector:
    app: ecommerce-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
